name: Pipelineia — tests et vidéo démo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Vérifier les dépendances
        run: python -m pip check
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Montage sans réseau, compte ni génération payante
        run: python -m pipelineia demo --quick --silent
      - uses: actions/upload-artifact@v4
        with:
          name: video-demo-60-secondes
          path: |
            output/demo/*.mp4
            output/demo/*.png
            output/demo/*.srt
            output/demo/timing.json
          retention-days: 3
          if-no-files-found: error
