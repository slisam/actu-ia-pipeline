language: fr
timezone: Europe/Paris
paths:
  output: output
  state_db: data/state.sqlite3
  logs: logs
news:
  max_age_hours: 48
  max_articles: 8
  min_article_chars: 200
sources:
  - name: OpenAI
    url: https://openai.com/news/rss.xml
  - name: Google AI
    url: https://blog.google/innovation-and-ai/technology/ai/rss/
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
  - name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
llm:
  provider: api_pool
  model: gemini-3.1-flash-lite
  cli_command: gemini
  cli_model: auto
  max_requests_per_run: 4
  max_http_attempts_per_run: 8
  daily_request_limit: 12
  max_output_tokens: 3000
  api_pool:
    - id: google_1
      provider: gemini
      api_key_env: GEMINI_API_KEY_1
      quota_group: a-renseigner-projet-1
      free_tier_confirmed: false
    - id: google_2
      provider: gemini
      api_key_env: GEMINI_API_KEY_2
      quota_group: a-renseigner-projet-2
      free_tier_confirmed: false
    - id: google_3
      provider: gemini
      api_key_env: GEMINI_API_KEY_3
      quota_group: a-renseigner-projet-3
      free_tier_confirmed: false
    - id: google_4
      provider: gemini
      api_key_env: GEMINI_API_KEY_4
      quota_group: a-renseigner-projet-4
      free_tier_confirmed: false
browser:
  channel: chrome
  profile_dir: data/google-chrome-browser
  headless: false
  timeout_seconds: 180
speech:
  provider: elevenlabs
  voice: fr-fr
  rate: 155
  google_voice: fr-FR-Standard-A
  elevenlabs:
    model_id: eleven_flash_v2_5
    output_format: mp3_44100_128
    language_code: fr
    max_characters: 5000
    timeout_seconds: 120
    voice_settings:
      stability: 0.5
      similarity_boost: 0.75
      style: 0
      use_speaker_boost: true
      speed: 1.0
video:
  duration_seconds: 60
  fps: 30
  formats:
    vertical: {width: 1080, height: 1920}
    square: {width: 1080, height: 1080}
    landscape: {width: 1920, height: 1080}
publishing:
  platforms: []
  youtube:
    privacy: private
  instagram:
    api_version: v25.0
alerts:
  enabled: true
  provider: telegram
  cooldown_seconds: 3600
  pending_delay_seconds: 900
  max_attempts: 3
  retry_base_seconds: 60
  timeout_seconds: 10
  batch_size: 10
